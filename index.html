<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITF-14 Label Preview</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --panel: #ffffff;
      --ink: #111827;
      --muted: #6b7280;
      --line: #d1d5db;
      --brand: #111827;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 24px;
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: 0 14px 35px rgba(15, 23, 42, .08);
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px;
    }

    .hint {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    label {
      display: block;
      margin: 12px 0 5px;
      font-size: 12px;
      color: #374151;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 11px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    input:focus, select:focus {
      border-color: #111827;
      box-shadow: 0 0 0 3px rgba(17, 24, 39, .10);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .status {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #f9fafb;
      border: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.45;
    }

    .status strong { display: block; margin-bottom: 2px; }

    .preview-wrap {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px;
      overflow: auto;
      box-shadow: 0 14px 35px rgba(15, 23, 42, .08);
    }

    #label-container {
      width: min(920px, 100%);
      margin: 0 auto;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      background: var(--brand);
      color: white;
      padding: 10px 14px;
      font-weight: 800;
      cursor: pointer;
    }

    button.secondary {
      background: #e5e7eb;
      color: #111827;
    }

    @media (max-width: 900px) {
      body { padding: 14px; }
      .app { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>ITF-14 Label Generator</h1>
      <p class="hint">
        ใช้ไฟล์เดียวจบ ไม่แยก CSS/JS และยังคง layout SVG เดิมไว้
        โดยเพิ่ม GTIN Level สำหรับสร้าง ITF-14: Lv3 หรือ Lv4
      </p>

      <label for="title">Title</label>
      <input id="title" value="QTM M5 ROCKY ASST BLUE (SET 4DM+BTL)" />

      <label for="subtitle">Subtitle</label>
      <input id="subtitle" value="QUANTUM M5 ROCKY ASST BLUE (SET 4DM+BTL)" />

      <label for="thaiName">Thai name</label>
      <input id="thaiName" value="ควอนตั้มปากกา M5 ร็อคกี้ น้ำเงินคละสี(4DM+BTL)" />

      <div class="row">
        <div>
          <label for="unitGtin13">GTIN-13 สินค้าเดี่ยว</label>
          <input id="unitGtin13" value="8851907342685" inputmode="numeric" />
        </div>
        <div>
          <label for="qty">QTY</label>
          <input id="qty" value="4" inputmode="numeric" />
        </div>
      </div>

      <div class="row">
        <div>
          <label for="gtinLevel">GTIN Level / Indicator</label>
          <select id="gtinLevel">
            <option value="3" selected>GTIN Lv3 / Indicator 3</option>
            <option value="4">GTIN Lv4 / Indicator 4</option>
          </select>
        </div>
        <div>
          <label for="location">LOCATION</label>
          <input id="location" value="IND" />
        </div>
      </div>

      <div class="row">
        <div>
          <label for="grossWeight">G.W.(Kg)</label>
          <input id="grossWeight" value="1.25" />
        </div>
        <div>
          <label for="lotNo">LOT NO.</label>
          <input id="lotNo" value="LOT2026" />
        </div>
      </div>

      <div class="actions">
        <button type="button" onclick="downloadSVG()">Download SVG</button>
        <button type="button" class="secondary" onclick="window.print()">Print</button>
      </div>

      <div class="status" id="status"></div>
    </section>

    <section class="preview-wrap">
      <div id="label-container"></div>
    </section>
  </main>

  <script>
    const labelData = {
      title: "QTM M5 ROCKY ASST BLUE (SET 4DM+BTL)",
      subtitle: "QUANTUM M5 ROCKY ASST BLUE (SET 4DM+BTL)",
      thaiName: "ควอนตั้มปากกา M5 ร็อคกี้ น้ำเงินคละสี(4DM+BTL)",
      unitGtin13: "8851907342685",
      gtinLevel: "3",
      location: "IND",
      qty: "4",
      grossWeight: "1.25",
      lotNo: "LOT2026"
    };

    function onlyDigits(value) {
      return String(value || "").replace(/\D/g, "");
    }

    function calcGtinCheckDigit(withoutCheckDigit) {
      const digits = onlyDigits(withoutCheckDigit);
      let sum = 0;

      for (let i = digits.length - 1, position = 0; i >= 0; i--, position++) {
        const n = Number(digits[i]);
        sum += n * (position % 2 === 0 ? 3 : 1);
      }

      return String((10 - (sum % 10)) % 10);
    }

    function isValidGtin(value, expectedLength) {
      const digits = onlyDigits(value);
      if (digits.length !== expectedLength) return false;

      const body = digits.slice(0, -1);
      const check = digits.slice(-1);
      return calcGtinCheckDigit(body) === check;
    }

    function buildITF14(unitGtin13, gtinLevel) {
      const unit = onlyDigits(unitGtin13);
      const level = onlyDigits(gtinLevel).slice(0, 1);

      if (!/^[0-9]$/.test(level)) {
        throw new Error("GTIN Level ต้องเป็นตัวเลข 0-9");
      }

      if (unit.length !== 13) {
        throw new Error("GTIN-13 ต้องมี 13 หลัก เช่น 8851907342685");
      }

      if (!isValidGtin(unit, 13)) {
        throw new Error("GTIN-13 check digit ไม่ถูกต้อง กรุณาตรวจเลขสินค้าเดี่ยว");
      }

      // ITF-14 ใช้ packaging indicator 1 หลัก + GTIN-13 ที่ตัด check digit เดิมออก 12 หลัก
      // แล้วคำนวณ check digit ใหม่ของ GTIN-14
      const body13 = level + unit.slice(0, 12);
      return body13 + calcGtinCheckDigit(body13);
    }

    function encodeITF14Rects(value, options = {}) {
      const digits = onlyDigits(value);

      if (digits.length !== 14) {
        throw new Error("ITF-14 ต้องมี 14 หลัก");
      }

      if (!isValidGtin(digits, 14)) {
        throw new Error("ITF-14 check digit ไม่ถูกต้อง");
      }

      const patterns = {
        "0": "nnwwn",
        "1": "wnnnw",
        "2": "nwnnw",
        "3": "wwnnn",
        "4": "nnwnw",
        "5": "wnwnn",
        "6": "nwwnn",
        "7": "nnnww",
        "8": "wnnwn",
        "9": "nwnwn"
      };

      const x = options.x ?? 24.5;
      const y = options.y ?? 47.8;
      const height = options.height ?? 16;
      const maxWidth = options.width ?? 123;
      const wideRatio = options.wideRatio ?? 2.5;

      const sequence = [];

      function addBar(size) { sequence.push({ type: "bar", size }); }
      function addSpace(size) { sequence.push({ type: "space", size }); }
      function moduleSize(char) { return char === "w" ? wideRatio : 1; }

      // Start pattern: narrow bar, narrow space, narrow bar, narrow space
      addBar(1); addSpace(1); addBar(1); addSpace(1);

      for (let i = 0; i < digits.length; i += 2) {
        const barPattern = patterns[digits[i]];
        const spacePattern = patterns[digits[i + 1]];

        for (let j = 0; j < 5; j++) {
          addBar(moduleSize(barPattern[j]));
          addSpace(moduleSize(spacePattern[j]));
        }
      }

      // Stop pattern: wide bar, narrow space, narrow bar
      addBar(wideRatio); addSpace(1); addBar(1);

      const totalUnits = sequence.reduce((sum, item) => sum + item.size, 0);
      const unitWidth = maxWidth / totalUnits;

      let cursor = x;
      let rects = "";

      for (const item of sequence) {
        const width = item.size * unitWidth;
        if (item.type === "bar") {
          rects += `<rect class="black" x="${cursor.toFixed(2)}" y="${y}" width="${width.toFixed(2)}" height="${height}"/>`;
        }
        cursor += width;
      }

      return rects;
    }

    function escapeText(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function collectData() {
      return {
        title: document.getElementById("title").value,
        subtitle: document.getElementById("subtitle").value,
        thaiName: document.getElementById("thaiName").value,
        unitGtin13: document.getElementById("unitGtin13").value,
        gtinLevel: document.getElementById("gtinLevel").value,
        location: document.getElementById("location").value,
        qty: document.getElementById("qty").value,
        grossWeight: document.getElementById("grossWeight").value,
        lotNo: document.getElementById("lotNo").value
      };
    }

    function renderLabel(data) {
      const status = document.getElementById("status");

      let itf14 = "";
      let barcodeRects = "";

      try {
        itf14 = buildITF14(data.unitGtin13, data.gtinLevel);
        barcodeRects = encodeITF14Rects(itf14);

        status.innerHTML = `
          <strong>พร้อมใช้งาน</strong>
          GTIN Lv${escapeText(data.gtinLevel)} / ITF-14: ${escapeText(itf14)}
        `;
      } catch (error) {
        itf14 = "ERROR";
        barcodeRects = "";
        status.innerHTML = `
          <strong>ตรวจสอบข้อมูล</strong>
          ${escapeText(error.message)}
        `;
      }

      const barcodeTop = `${onlyDigits(data.unitGtin13)} x ${escapeText(data.qty)}`;

      document.getElementById("label-container").innerHTML = `
        <svg id="label-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172.54 123.01" width="100%" height="auto">
          <defs>
            <style>
              .black { fill: #231f20; }
              .white { fill: #fff; }

              .title,
              .subtitle,
              .thai,
              .bold-small,
              .barcode-text {
                fill: #231f20;
                font-family: "Angsana New", "Times New Roman", serif;
                font-weight: 700;
              }

              .title {
                font-size: 22.16px;
                letter-spacing: -.02em;
              }

              .subtitle {
                font-size: 10.5px;
                letter-spacing: -.02em;
              }

              .thai {
                font-size: 9.75px;
              }

              .small {
                fill: #231f20;
                font-family: "Angsana New", "Times New Roman", serif;
                font-size: 11.45px;
              }

              .bold-small {
                font-size: 11.45px;
              }

              .barcode-text {
                font-size: 13.5px;
                letter-spacing: .05em;
              }

              .top-barcode-text {
                fill: #231f20;
                font-family: "Angsana New", "Times New Roman", serif;
                font-size: 11.25px;
              }
            </style>
          </defs>

          <!-- กรอบนอก -->
          <path class="black" d="M172.54,100.17H0V.95h172.54v99.21ZM.76,99.42h171.02V1.7H.76v97.72Z"/>

          <!-- ชื่อสินค้า -->
          <text class="title" transform="translate(8.47 15.92) scale(.52 1)">${escapeText(data.title)}</text>
          <text class="subtitle" transform="translate(8.9 25.56) scale(.96 1)">${escapeText(data.subtitle)}</text>
          <text class="thai" transform="translate(14.45 35.62)">${escapeText(data.thaiName)}</text>

          <!-- ตัวเลขด้านบนบาร์โค้ด -->
          <text class="top-barcode-text" transform="translate(104.6 44.26)">${barcodeTop}</text>

          <!-- กรอบบาร์โค้ด -->
          <path class="black" d="M164.4,66.05H8.14v-19.16h156.26v19.16ZM9.5,64.74h153.55v-16.53H9.5v16.53Z"/>

          <!-- แท่งบาร์โค้ด ITF-14 แบบ dynamic แต่คงตำแหน่ง layout เดิม -->
          <g>
            <rect class="white" x="14.17" y="35.46" width="143.53" height="68.82"/>
            ${barcodeRects}
          </g>

          <!-- เลขบาร์โค้ด -->
          <text class="barcode-text" transform="translate(7.49 74.88)">${escapeText(itf14)}</text>

          <!-- หัวตาราง -->
          <text class="small" transform="translate(9.8 84.61) scale(1.04 1)">LOCATION</text>
          <text class="small" transform="translate(56.81 84.39) scale(1.04 1)">QTY</text>
          <text class="small" transform="translate(80.01 84.39) scale(1.04 1)">G.W.(Kg)</text>
          <text class="small" transform="translate(125.48 84.39) scale(1.04 1)">LOT NO.</text>

          <!-- กรอบตาราง -->
          <path class="black" d="M164.55,93.9H7.71v-16.74h156.84v16.74ZM8.23,93.39h155.78v-15.71H8.23v15.71Z"/>
          <rect class="black" x="51.71" y="77.43" width=".53" height="16.22"/>
          <rect class="black" x="77.25" y="77.43" width=".53" height="16.22"/>
          <rect class="black" x="114.29" y="77.43" width=".53" height="16.22"/>

          <!-- ค่าตาราง -->
          <text class="bold-small" transform="translate(22.96 92.11) scale(1.01 1)">${escapeText(data.location)}</text>
          <text class="bold-small" transform="translate(62.58 92.11) scale(1.01 1)">${escapeText(data.qty)}</text>
          <text class="bold-small" transform="translate(87 92.11) scale(1.01 1)">${escapeText(data.grossWeight)}</text>
          <text class="bold-small" transform="translate(128 92.11) scale(1.01 1)">${escapeText(data.lotNo)}</text>
        </svg>
      `;
    }

    function update() {
      renderLabel(collectData());
    }

    function downloadSVG() {
      const svg = document.getElementById("label-svg");
      if (!svg) return;

      const source = new XMLSerializer().serializeToString(svg);
      const blob = new Blob([source], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "itf14-label.svg";
      link.click();

      URL.revokeObjectURL(url);
    }

    document.querySelectorAll("input, select").forEach((field) => {
      field.addEventListener("input", update);
      field.addEventListener("change", update);
    });

    renderLabel(labelData);
  </script>
</body>
</html>
